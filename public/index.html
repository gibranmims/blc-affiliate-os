<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BLC OS">
  <title>BLC OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Mobile top bar (hidden on desktop) -->
  <header class="mobile-topbar">
    <button class="mobile-menu-btn" onclick="toggleMobileNav()" aria-label="Open menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="mobile-topbar-logo">BLC<span style="font-weight:400;opacity:0.5"> OS</span></div>
    <div class="mobile-topbar-spacer"></div>
  </header>

  <!-- Mobile nav scrim (tap to close drawer) -->
  <div class="mobile-nav-scrim" onclick="closeMobileNav()"></div>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-mark">
            BLC<span style="font-weight:400;opacity:0.5"> OS</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item" data-page="home">
          <i class="fa-solid fa-house nav-icon"></i>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item" data-page="tasks">
          <i class="fa-solid fa-list-check nav-icon"></i>
          <span>Team Tasks</span>
          <span class="nav-review-badge" id="tasks-nav-badge" style="display:none">0</span>
        </a>

        <div class="nav-divider"></div>

        <!-- One entry per hub. Each opens a landing page of cards that
             drill into the actual tools, so the sidebar stays short. -->
        <a href="#" class="nav-item" data-page="marketing">
          <i class="fa-solid fa-bullhorn nav-icon"></i>
          <span>Marketing</span>
        </a>
        <a href="#" class="nav-item" data-page="growth">
          <i class="fa-solid fa-arrow-trend-up nav-icon"></i>
          <span>Growth</span>
        </a>
        <a href="#" class="nav-item" data-page="projects">
          <i class="fa-solid fa-diagram-project nav-icon"></i>
          <span>Projects</span>
        </a>
        <a href="#" class="nav-item" data-page="operations">
          <i class="fa-solid fa-gear nav-icon"></i>
          <span>Operations</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <!-- Static identity row. It used to open App Settings, whose only
             field was a Discord link for affiliate welcome emails — both
             the emails and the setting are gone. -->
        <div class="sidebar-user-row sidebar-user-static">
          <div class="sidebar-user-avatar">G</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name">Gibran</div>
            <div class="sidebar-user-sub">The Bikini Line Co.</div>
          </div>
        </div>
        <button class="sidebar-collapse-bar" onclick="toggleSidebar()" id="sidebar-collapse-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          <span>Hide sidebar</span>
        </button>
      </div>
    </aside>

    <!-- Sidebar reveal (visible only when sidebar is hidden) -->
    <button id="sidebar-reveal-btn" onclick="toggleSidebar()" title="Show sidebar" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

    <!-- Main Content -->
    <main class="main-content">
      <div id="page-content" class="page-content">
        <div class="loading-screen">
          <div class="spinner"></div>
          <p>Loading BLC OS...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button class="modal-close" onclick="closeModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Detail Panel (creator drawer) -->
  <div id="detail-panel" class="detail-panel" style="display:none">
    <div class="detail-overlay" onclick="closeDetailPanel()"></div>
    <div class="detail-drawer">
      <div class="detail-drawer-header">
        <span class="detail-drawer-title" id="detail-drawer-title"></span>
        <button class="detail-close-btn" onclick="closeDetailPanel()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="detail-drawer-body" id="detail-drawer-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
